[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-survivor-model"
version = "0.1.0"
description = "Starter scaffold for an NFL survivor pool optimizer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
